        amountText: "대출 이자 연 최대 150만 원", amt: { "1y": 150, "2y": 300, "all": 300 }, source: "보조금24", verified: "10/26",
        elig: [["met", "나이"], ["needs_review", "전세 계약"]],

// 함께 받을 수 없는 쌍 (공고 원문 근거) — 조합 계산에서 같은 조합에 넣지 않는다

  { ids: ["P3", "P1"], unverified: ["P1", "P3"] },

const RATE = 0.025;

function pvOf(id, per) {
  const x = POLICIES[id], H = HORIZON[per], a = x.amt[per], d = (m) => Math.pow(1 + RATE, -m / 12);
  if (x.type === "maturity") return a * d(H);                                   // 만기에 한 번에 받음

  const n = Math.min(x.span || H, H); let s = 0; for (let m = 1; m <= n; m++) s += a / n * d(m); return s;        // 매달 받음
}
const val = (id, per) => S.pv ? Math.round(pvOf(id, per)) : POLICIES[id].amt[per];

    <div class="card sub"><b>확인이 필요한 것</b>${x.elig.filter(e => e[0] === "needs_review").map(e => `<p>? ${e[1]}: 입력하지 않았거나 공식 기준이 불명확해요</p>`).join("") || "<p class='muted'>없어요</p>"}</div>

    <p class="disclaimer">AI가 계산을 돕는 참고 결과예요. 최종 자격과 최신 조건은 신청 기관에서 확인해 주세요.</p>
  </main>${foot()}${cta("신청하러 가기 ↗", `window.open('${SRC_URL[x.source]}', '_blank', 'noopener')`)}`;
}

// ===== 공통 페이지 =====
function about() { return bar("이용 안내", true) + `<main><h2>청년 정책 매니저는<br>이렇게 만들어졌어요</h2>
  <div class="card"><b>AI가 하는 일</b><p>정책 원문에서 근거를 찾고(RAG), 필요한 도구를 골라 쓰고(Agent), 추천 이유를 설명해요.</p></div>
  <div class="card"><b>AI가 하지 않는 일</b><p>자격 판정, 금액 계산, 조합 계산은 코드가 해요. AI는 숫자를 바꾸지 않아요. 최종 자격을 확정하지 않아요.</p></div>
  <div class="card"><b>데이터</b><p>온통청년 청년정책 API, 공공데이터포털 공공서비스(보조금24) API. 매일 새벽 3시에 갱신해요.</p></div>
  <div class="card"><b>한계</b><p>두 API에 없는 정책은 다루지 않아요. 금액·중복 여부를 검수한 정책만 조합에 들어가요.</p></div></main>${foot()}`; }
function privacy() { return bar("개인정보 처리방침", true) + `<main><h2>개인정보 처리방침 (시안)</h2>
  <div class="card"><dl class="kv"><dt>받는 정보</dt><dd>선택한 조건 (나이, 지역, 상황, 소득·재산 구간 등)</dd><dt>저장 위치</dt><dd>'기억하기'를 켠 경우 사용자 브라우저에만 30일. 서버에는 저장하지 않아요</dd><dt>외부 전달</dt><dd>정책 분석을 위해 AI API에 조건을 전달해요. 특수 조건과 부모님 소득·재산은 보내지 않아요</dd><dt>이용 통계</dt><dd>구글 애널리틱스 (쿠키 사용, 조건 값은 보내지 않아요)</dd><dt>지우기</dt><dd>하단 '내 정보 지우기'를 누르면 바로 지워져요</dd></dl></div></main>${foot()}`; }
function notFound(t = "페이지를 찾을 수 없어요", d = "주소를 다시 확인해 주세요") { return bar("", true) + `<main><div class="empty"><span class="big">🔎</span><h2>${t}</h2><p class="muted">${d}</p></div></main>${cta("처음으로", "go('#/')")}`; }
function emptyResult() { return bar("추천 조합", true) + `<main><div class="empty"><span class="big">📭</span><h2>지금 다루는 정책 중엔<br>맞는 게 없어요</h2><p class="muted">초기에는 취업·주거 혜택만 다뤄요. 나머지 분야는 확장 예정이에요</p></div>
  <button class="btn line" onclick="go('#/conditions/13')">조건 바꾸기</button><button class="btn ghost" onclick="toast('온통청년으로 이동 (시안)')">온통청년에서 더 찾아보기 ↗</button><button class="btn ghost" onclick="toast('복지로로 이동 (시안)')">복지로에서 더 찾아보기 ↗</button></main>${foot()}`; }

// ===== 화면설계서용 번호 표시 =====
// ?annot 를 붙이면 요소마다 빨간 번호를 붙인다. 번호는 기획서(README) 1부의 요소 표 번호와 같다
const ANNOT = {
  s1: [[".bar .logo"], ["main h1"], [".how"], ["main .card.sub"], [".check", 0], [".check", 1], [".cta .btn"], [".foot"]],
  s2_1: [[".bar .back"], [".bar .step"], [".progress"], ["main h2"], ["main .field"], ["main .note"], ["main .chips"], [".cta .btn"]],
  s2_6: [[".bar .back"], [".bar .step"], [".progress"], ["main h2"], ["main .options"], ["main .chips", 0], ["main .chips", 1], [".cta .btn"]],
  s2_9: [["main h2"], ["main .chips"], ["main p.small"], [".cta .btn"]],
  s2_12: [[".bar .link"], ["main h2"], ["main .chips", 0], ["main .chips", 1], ["main .chips", 2], [".cta .btn"]],
  s2_13: [["main h2"], ["main .card .row", 0], [".cta .btn"]],
  load: [["main h2"], [".steps > div", 0], [".steps > div", 2], [".steps small", 0]],
  s3: [["main > p.muted"], [".bar .link"], ["main > .tabs"], [".pvt"], [".combo", 0], [".cgive", 0], [".segbar", 0], [".why"], [".item", 0], [".item .st", 0], [".item p.small", 0], [".iact a", 0], [".warnbox"], [".fold", 0], ["main > .btn.line"], ["main > .btn.ghost"], ["main > .disclaimer"]],
  s4: [["main .chips"], ["main > .card", 0], [".emtr"], [".emtr .emeter"], [".s.not_met"], [".s.needs_review"], ["main > .card.sub"], ["main > .disclaimer"]],
  s5: [["main > .row"], ["main > h2"], ["main > .card", 0], ["blockquote", 0], ["main > .card", 1], ["main > .card", 2], ["main > .card", 3], ["main > .card", 4], ["main > .card", 5], ["main > .src"], [".cta .btn"]],
  empty: [["main .empty h2"], ["main > .btn.line"], ["main > .btn.ghost", 0]],
};
function annotKey() {
  const h = location.hash || "#/", m = h.match(/^#\/conditions\/(\d+)$/);
  if (h === "#/") return "s1";
  if (m) return ANNOT["s2_" + m[1]] ? "s2_" + m[1] : null;
  return { "#/loading-static": "load", "#/result": "s3", "#/what-if": "s4", "#/result-empty": "empty" }[h] || (h.startsWith("#/policy/") ? "s5" : null);
}
function annotate() {
  if (!location.search.includes("annot")) return;
  document.querySelectorAll(".anb").forEach(e => e.remove());
  const list = ANNOT[annotKey()] || [];
  list.forEach(([sel, n], i) => {
    const el = document.querySelectorAll(sel)[n || 0]; if (!el) return;
    const fixed = !!el.closest(".cta"), r = el.getBoundingClientRect(), x = r.left + (fixed ? 0 : scrollX), y = r.top + (fixed ? 0 : scrollY), pos = fixed ? "fixed" : "absolute";
    const box = document.createElement("div"); box.className = "anb";
    box.style.cssText = `position:${pos};left:${x - 3}px;top:${y - 3}px;width:${r.width + 6}px;height:${r.height + 6}px;border:2px dashed #E5484D;border-radius:10px;pointer-events:none;z-index:50`;
    const b = document.createElement("div"); b.className = "anb"; b.textContent = i + 1;
    b.style.cssText = `position:${pos};left:${x - 12}px;top:${y - 12}px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#E5484D;color:#fff;font:700 12px/22px Pretendard,sans-serif;text-align:center;z-index:51;pointer-events:none;box-shadow:0 0 0 2px #fff`;
    // 화면 아래 고정 버튼은 아래쪽 기준으로 붙여야 캡처 때 어긋나지 않는다
    if (fixed) { box.style.top = b.style.top = "auto"; box.style.bottom = (innerHeight - r.bottom - 3) + "px"; b.style.bottom = (innerHeight - r.top + 12 - 22) + "px";
      const cx = innerWidth / 2; box.style.left = `calc(50% + ${r.left - cx - 3}px)`; b.style.left = `calc(50% + ${r.left - cx - 12}px)`; }
    document.body.append(box, b);
  });
}

// ===== 라우터 =====
function render() {
  const h = location.hash || "#/", app = document.getElementById("app"); let m;
  if (h === "#/") app.innerHTML = s1();
  else if ((m = h.match(/^#\/conditions\/(\d+)$/)) && +m[1] >= 1 && +m[1] <= N) app.innerHTML = s2(+m[1]);
  else if (h === "#/loading") app.innerHTML = loading(false);
  else if (h === "#/loading-static") app.innerHTML = loading(true);
  else if (h === "#/result") app.innerHTML = s3();
  else if (h === "#/result-empty") app.innerHTML = emptyResult();
  else if (h === "#/what-if") { ensureDemo(); app.innerHTML = s4(); }
  else if ((m = h.match(/^#\/policy\/(\w+)$/))) app.innerHTML = s5(m[1]);
  else if (h === "#/about") app.innerHTML = about();
  else if (h === "#/privacy") app.innerHTML = privacy();
  else app.innerHTML = notFound();
  if (location.search.includes("annot")) document.fonts.ready.then(() => setTimeout(annotate, 600));
}
// 시안 그림용 미리 채우기: ?demo 를 붙이면 조건이 채워진 상태로 시작
if (location.search.includes("pv")) S.pv = true;
if (location.search.includes("cliff")) S.whatif = "연 소득이 오르면";
if (location.search.includes("demo")) { S.cond = JSON.parse(JSON.stringify(demo)); S.consent = true; S.remember = true; }
if (location.search.includes("old")) S.cond.age = 41;
if (location.search.includes("open")) { S.open = { ex: true, ne: true }; }
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); if (location.hash === "#/loading") runLoading(); });
render(); if (location.hash === "#/loading") runLoading();
</script>
