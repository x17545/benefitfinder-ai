[project]
name = "benefitfinder-ai"
version = "0.1.0"
description = "청년 취업·주거 지원금 조합 비교 서비스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "psycopg[binary]>=3.3,<4",
  "pypdf>=7.1,<8",
  "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
decider = [
    "flash-linear-attention==0.5.2",
    "huggingface-hub==1.31.0",
    "olefile==0.47",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]
dev = [
  "httpx2>=2,<3",
  "jsonschema[format]>=4.26,<5",
  "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/benefitfinder"]

[tool.uv]
required-version = ">=0.9.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
