[project]
name = "benefitfinder-ai"
version = "0.1.0"
description = "청년 취업·주거 지원금 조합 비교 서비스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "jsonschema[format]>=4.26,<5",
  "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/benefitfinder"]

[tool.uv]
required-version = ">=0.9.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
