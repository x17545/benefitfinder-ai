name: Repository checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the actual PR head; a synthetic merge commit would hide a missing main merge.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Python dependencies from lockfile
        run: uv sync --locked
      - name: Install JavaScript dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Refresh main for PR or manual work-branch check
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Check PR or manual work branch and main integration
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          WORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: uv run --locked python scripts/check.py --branch "$WORK_BRANCH" --pr
      - name: Check main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WORK_BRANCH: ${{ github.ref_name }}
        run: uv run --locked python scripts/check.py --branch "$WORK_BRANCH" --allow-main
