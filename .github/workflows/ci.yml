name: Repository checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the actual PR head; a synthetic merge commit would hide a missing main merge.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Refresh main for PR or manual work-branch check
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Check PR or manual work branch and main integration
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          WORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python scripts/check.py --branch "$WORK_BRANCH" --pr
      - name: Check main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WORK_BRANCH: ${{ github.ref_name }}
        run: python scripts/check.py --branch "$WORK_BRANCH" --allow-main
